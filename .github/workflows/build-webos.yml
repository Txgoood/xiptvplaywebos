name: Build webOS IPK (Test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webos/**'
      - '.github/workflows/build-webos.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build React for webOS
        run: npm run build
      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli
      - name: Package webOS app
        run: |
          cp webos/appinfo.json dist/appinfo.json
          mkdir -p out
          ares-package dist -o out
          test -n "$(find out -maxdepth 1 -name '*.ipk' -print -quit)"
      - name: Upload test IPK
        uses: actions/upload-artifact@v4
        with:
          name: XIPTV-Play-webOS-Test-IPK
          path: out/*.ipk
          if-no-files-found: error
